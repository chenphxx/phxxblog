name: CI

# 两个 job: 后端 pytest(backend)与前端类型/测试/构建(frontend)。
#
# 路径过滤必须同时覆盖 backend/** 与 frontend/** —— 只写 backend/** 时,
# 单独改前端不会触发任何检查(这是先前的漏洞: 前端改动 CI 全绿, 实际什么都没跑)。
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 检查与格式规则都在 backend/ruff.toml, 与本地 verify_all.py 跑的是同一套
      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      # 测试用内存 SQLite, 不需要 MySQL 服务, 也不会碰到开发库
      - name: Run tests
        env:
          PHXXBLOG_SECRET_KEY: test-secret-key-0123456789abcdefghijklmnop
        run: python -m pytest tests -q

  frontend:
    name: frontend (types / tests / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本取自仓库根的 .nvmrc, 与本地开发保持一致。
      # 这里曾经写死 node-version: '20', 结果是: jsdom 30 依赖 undici 8, 而 undici 8 需要
      # node:worker_threads 的 markAsUncloneable(Node >= 22.19), 在 Node 20 上加载 jsdom 直接抛
      # "TypeError: webidl.util.markAsUncloneable is not a function" —— 5 个测试文件全部起不来。
      # 改 Node 版本时请同时改 .nvmrc 与 frontend/package.json 的 engines。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 主题令牌是生成物: 改了 tokens.mjs 却忘记重新生成, 这里会失败
      - name: Verify generated themes are in sync
        run: npm run themes:audit

      - name: Verify icon paths
        run: npm run check:icons

      # 程序式 API(ElMessage / ElMessageBox)的样式不会自动注入, 漏了会让确认框变裸样式
      - name: Verify Element Plus programmatic styles
        run: npm run check:element-styles

      # 配置在 frontend/eslint.config.js 与 frontend/.prettierrc.json
      - name: Lint (eslint)
        run: npm run check:lint

      - name: Check formatting (prettier)
        run: npm run check:format

      - name: Type check & unit tests
        run: |
          npx vue-tsc -b --force
          npm run test

      # 构建一次, 顺带打印首屏/整包体积(防止悄悄回退到"打开首页要下 1MB")
      - name: Build & report bundle size
        run: |
          npm run build
          npm run check:size
